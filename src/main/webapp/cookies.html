<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>cookies</title>
</head>
<body>
<h1>Cookies</h1>

    <form action="cookies" method="post">

        <!--Nombre-->
        <label for="nombre">Nombre:</label>
        <input 
            type="text"
            id="nombre"
            name="nombre"
            maxlength="50"
            required>

        <br><br>

        <!--Edad-->
        <label for="edad">Edad:</label>
        <input 
            type="number"
            id="edad"
            name="edad"
            min="1"
            max="120"
            required>

        <br><br>

        <!--Genero-->
        <label for="genero">Género:</label>

        <select id="genero" name="genero" required>

            <option value="">Seleccione...</option>

            <option value="Femenino">
                Femenino
            </option>

            <option value="Masculino">
                Masculino
            </option>

            <option value="Otro">
                Otro
            </option>

        </select>

        <br><br>

        <!--Ciudad-->
        <label for="ciudad">Ciudad:</label>

        <select id="ciudad" name="ciudad" required>

            <option value="">Seleccione...</option>

            <option value="Neiva">
                Neiva
            </option>

            <option value="Bogotá">
                Bogotá
            </option>

            <option value="Medellín">
                Medellín
            </option>

            <option value="Cali">
                Cali
            </option>

        </select>

        <br><br>

        <!--Boolean-->
        <label>
            <input
                type="checkbox"
                name="acepta"
                value="true">
            Acepto los términos y condiciones
        </label>

        <br><br>

        <!--Correo-->
        <label for="correo">Correo:</label>

        <input
            type="email"
            id="correo"
            name="correo"
            required>

        <br><br>

        <button type="submit">
            Guardar Cookies
        </button>

    </form>

    <br>

    <a href="index.html">
        Volver al inicio
    </a>
    
    <a href="verCookies">
    Ver cookies almacenadas
	</a>
</body>
</html>
