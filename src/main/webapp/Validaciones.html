<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Validaciones</title>
</head>
<body>
<h1>Validaciones</h1>

    <form action="validacion" method="post">

        <label>Nombre:</label>
        <input type="text" id="nombre" name="nombre" maxlength="50" pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ ]+" required>

        <br><br>

        <label>Edad:</label>
        <input type="number" id="edad" name="edad" min="1" max="120" required>

        <br><br>

        <label>Correo:</label>
        <input type="email" id="correo" name="correo" required>

        <br><br>

        <button type="submit">GO</button>

    </form>

    <br>

    <a href="index.html">Volver al inicio</a>

</body>
</html>
