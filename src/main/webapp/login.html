<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Iniciar sesión</title>
</head>
<body>
<h1>Iniciar sesión</h1>

    <form action="login" method="post">

        <label for="usuario">Usuario:</label>
        <input 
            type="text"
            id="usuario"
            name="usuario"
            required>

        <br><br>

        <label for="password">Contraseña:</label>
        <input 
            type="password"
            id="password"
            name="password"
            required>

        <br><br>

        <button type="submit">
            Iniciar sesión
        </button>

    </form>

    <br>

    <a href="index.html">
        Volver al inicio
    </a>
</body>
</html>
